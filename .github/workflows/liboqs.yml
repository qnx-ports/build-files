name: liboqs

permissions:
  contents: write
  checks: write

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/liboqs.yml"
      - "ports/liboqs/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/liboqs.yml"
      - "ports/liboqs/**"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        qnx_env: ["800"]
    name: Build for QNX ${{ matrix.qnx_env }}
    runs-on: ubuntu-22.04-common
    if: |
      ((github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.title, 'liboqs')))
    steps:
      - name: Checkout build-files
        uses: actions/checkout@v4
        with:
          path: build-files

      - name: Checkout liboqs
        uses: actions/checkout@v4
        with:
          repository: open-quantum-safe/liboqs
          path: liboqs
          ref: 0.16.0

      - name: Build liboqs
        shell: bash
        run: |
          source ~/qnx/800/qnxsdp-env.sh
          make -C build-files/ports/liboqs install
