name: libwebsockets

permissions:
  contents: write
  checks: write

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/libwebsockets.yml"
      - "ports/libwebsockets/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/libwebsockets.yml"
      - "ports/libwebsockets/**"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        qnx_env: ["800"]
    runs-on: ubuntu-22.04-common
    if: |
      ((github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.title, 'libwebsockets')))
    steps:
      - name: Checkout build-files
        uses: actions/checkout@v4
        with:
          path: build-files
      
      - name: Checkout libuv
        uses: actions/checkout@v4
        with:
          repository: qnx-ports/libuv
          path: libuv

      - name: Build libuv
        shell: bash
        run: |
          source ~/qnx/800/qnxsdp-env.sh
          make -C build-files/ports/libuv install

      - name: Checkout libwebsockets
        uses: actions/checkout@v4
        with:
          repository: qnx-ports/libwebsockets
          path: libwebsockets

      - name: Build libwebsockets
        shell: bash
        run: |
          source ~/qnx/800/qnxsdp-env.sh
          make -C build-files/ports/libwebsockets install
