name: llama.cpp

permissions:
  contents: write
  checks: write

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/llama.cpp.yml'
      - 'ports/llama.cpp/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/llama.cpp.yml'
      - 'ports/llama.cpp/**'

jobs:

  build:
    runs-on: ubuntu-22.04-common
    if: |
      ((github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.title, 'llama.cpp')))
    steps:
    - name: Checkout build-files
      uses: actions/checkout@v4
      with:
        path: build-files

    - name: Checkout llama.cpp
      uses: actions/checkout@v4
      with:
        repository: ggml-org/llama.cpp
        ref: b12778
        path: llama.cpp

    - name: Build llama.cpp
      shell: bash
      run: |
        source ~/qnx/800/qnxsdp-env.sh
        QNX_PROJECT_ROOT="$(pwd)/llama.cpp" make -C build-files/ports/llama.cpp install JLEVEL=$(nproc)
