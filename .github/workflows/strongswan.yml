name: strongswan

permissions:
  contents: write
  checks: write


on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/strongswan.yml'
      - 'ports/strongswan/'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/strongswan.yml'
      - 'ports/strongswan/'
jobs:

  build:
    strategy:
      matrix:
        qnx_env: ["710", "800"]
    name: Build StrongSwan for QNX ${{ matrix.qnx_env }}
    runs-on: ubuntu-22.04-common
    if: |
      ((github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.title, 'strongswan')))
    steps:
      - name: Checkout build-files
        uses: actions/checkout@v4
        with:
          path: build-files

      - name: Clone StrongSwan
        run: |
          cd ${{ github.workspace }}
          git clone https://github.com/qnx-ports/strongswan.git

      - name: Build StrongSwan
        shell: bash
        run: |
          if [[ "${{ matrix.qnx_env }}" == "800" ]]; then
            source ~/qnx/800/qnxsdp-env.sh
          else
            source ~/qnx/710/qnxsdp-env.sh
          fi

          QNX_PROJECT_ROOT="$(pwd)/strongswan" make -C build-files/ports/strongswan clean
          QNX_PROJECT_ROOT="$(pwd)/strongswan" make -C build-files/ports/strongswan install
