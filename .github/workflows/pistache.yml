name: pistache

permissions:
  contents: write
  checks: write


on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pistache.yml"
      - "ports/pistache/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/pistache.yml"
      - "ports/pistache/**"

jobs:
  build:
    strategy:
      matrix:
        qnx_env: ["710", "800"]
        version:
          - { dir: "0.4.26", ref: "qnx-v0.4.26_p0", libevent_ref: "qnx-2.1.13_p1" }
    name: Build pistache ${{ matrix.version.dir }} for QNX ${{ matrix.qnx_env }}
    runs-on: ubuntu-22.04-common
    if: |
      ((github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.title, 'pistache')))
    steps:
      - name: Checkout build-files
        uses: actions/checkout@v4
        with:
          path: build-files

      - name: Checkout libevent
        uses: actions/checkout@v4
        with:
          repository: qnx-ports/libevent
          ref: ${{ matrix.version.libevent_ref }}
          path: libevent
          submodules: recursive

      - name: Checkout pistache
        uses: actions/checkout@v4
        with:
          repository: qnx-ports/pistache
          ref: ${{ matrix.version.ref }}
          path: pistache
          submodules: recursive

      # pistache finds libevent through pkg-config in the SDP, so libevent has to be installed first.
      - name: Build libevent
        shell: bash
        run: |
          if [[ ${{ matrix.qnx_env }} == 710 ]]; then
            source ~/qnx/710/qnxsdp-env.sh
          else
            source ~/qnx/800/qnxsdp-env.sh
          fi
          make -C build-files/ports/libevent install

      - name: Build pistache
        shell: bash
        run: |
          if [[ ${{ matrix.qnx_env }} == 710 ]]; then
            source ~/qnx/710/qnxsdp-env.sh
          else
            source ~/qnx/800/qnxsdp-env.sh
          fi
          export PATH=/usr/local/qnx/env/bin:$PATH
          make -C build-files/ports/pistache install
