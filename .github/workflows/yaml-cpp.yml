name: yaml-cpp

permissions:
  contents: write
  checks: write

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/yaml-cpp.yml"
      - "ports/yaml-cpp/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/yaml-cpp.yml"
      - "ports/yaml-cpp/**"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        qnx_env: ["800"]
    runs-on: ubuntu-22.04-common
    if: |
      ((github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.title, 'yaml-cpp')))
    steps:
      - name: Checkout build-files
        uses: actions/checkout@v4
        with:
          path: build-files

      - name: Checkout muslflt
        uses: actions/checkout@v4
        with:
          repository: qnx-ports/muslflt
          path: muslflt

      - name: Checkout yaml-cpp
        uses: actions/checkout@v4
        with:
          repository: jbeder/yaml-cpp
          path: yaml-cpp
          ref: yaml-cpp-0.9.0

      - name: Build muslflt
        shell: bash
        run: |
          source ~/qnx/800/qnxsdp-env.sh
          QNX_PROJECT_ROOT="$(pwd)/muslflt" make -C build-files/ports/muslflt install

      - name: Build yaml-cpp
        shell: bash
        run: |
          source ~/qnx/800/qnxsdp-env.sh
          BUILD_TESTING="ON" QNX_PROJECT_ROOT="$(pwd)/yaml-cpp" make -C build-files/ports/yaml-cpp install
