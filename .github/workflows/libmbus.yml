name: libmbus

permissions:
  contents: write
  checks: write

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/libmbus.yml'
      - 'ports/libmbus/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/libmbus.yml'
      - 'ports/libmbus/**'

jobs:

  build:
    strategy:
      matrix:
        qnx_env: ["800"]
    name: Build for QNX ${{ matrix.qnx_env }}
    runs-on: ubuntu-22.04-common
    if: |
      ((github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.title, 'libmbus')))
    steps:
    - name: Checkout build-files
      uses: actions/checkout@v4
      with:
        path: build-files

    - name: Checkout libmbus
      uses: actions/checkout@v4
      with:
        repository: rscada/libmbus
        path: libmbus
        ref: 0.10.4

    - name: Build libmbus
      shell: bash
      run: |
        source ~/qnx/${{ matrix.qnx_env }}/qnxsdp-env.sh
        BUILD_TESTING=ON JLEVEL=$(nproc) QNX_PROJECT_ROOT="$(pwd)/libmbus" make -C build-files/ports/libmbus clean install
